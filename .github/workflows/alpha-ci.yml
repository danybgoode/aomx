name: Project checks
on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aomx_alpha_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d aomx_alpha_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AOMX_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/aomx_alpha_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Validate ingest image imports
        run: |
          docker build -f deploy/alpha/Dockerfile -t aomx-ingest:ci .
          docker run --rm --entrypoint node aomx-ingest:ci --input-type=module -e "await import('./src/alpha/versions.mjs'); await import('./src/funnel/postgres.mjs'); await import('./src/funnel/http.mjs')"
      - name: Validate pinned private-match image
        run: |
          docker build --platform linux/amd64 -f deploy/alpha/match.Dockerfile -t aomx-match:ci .
          docker run --rm --entrypoint /usr/local/bin/godot aomx-match:ci --version
          docker run --rm --platform linux/amd64 --read-only --tmpfs /tmp:size=64m,nosuid \
            --memory 768m --cpus 0.75 --pids-limit 64 --cap-drop ALL \
            --security-opt no-new-privileges --entrypoint node aomx-match:ci \
            --input-type=module -e 'import { GodotMatchWorker } from "./src/multiplayer/worker.mjs"; const worker = await new GodotMatchWorker({godotBin:"/usr/local/bin/godot",gamePath:"/app/game"}).start(); try { const a=await worker.request({type:"init",map_id:"la_roma",factions:["regios","poblanos"],seed:1}); const b=await worker.request({type:"tick"}); if(!a.ok||!b.ok||b.tick!==1) throw Error("worker_init_tick_failed"); } finally {worker.close()}'
      - name: Install pinned Godot
        run: |
          curl -fsSL -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot.zip' | sha256sum -c -
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
      - name: Godot headless and client-to-ingest checks
        env:
          GODOT_BIN: /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
        run: |
          "$GODOT_BIN" --headless --path game --import
          for test in simulation_test.gd outbox_test.gd skirmish_test.gd faction_test.gd district_test.gd skirmish_client_test.gd presentation_cues_test.gd rules_content_test.gd strategic_economy_test.gd strategic_progression_test.gd strategic_ai_test.gd strategic_opponent_test.gd opponent_scenario_report.gd skirmish_persistence_test.gd skirmish_replay_test.gd multiplayer_replay_test.gd cross_platform_hash_test.gd skirmish_save_client_test.gd warfare_test.gd; do
            "$GODOT_BIN" --headless --path game --script "res://tests/$test"
          done
          "$GODOT_BIN" --headless --path game --script res://tests/skirmish_scale_benchmark.gd
          WARFARE_PERF_ENFORCE=false "$GODOT_BIN" --headless --path game --script res://warfare_performance_probe.gd
          npm run skirmish:contract
          npm run multiplayer:integration
          npm run multiplayer:replay-integration
